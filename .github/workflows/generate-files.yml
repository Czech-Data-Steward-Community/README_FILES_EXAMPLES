name: Generate Final Templates

on:
  push:
    branches:
      - main
    paths:
      - 'core-file.md'
      - 'guide-md.md'
      - 'guide-text.txt'
      - 'guide-json.json'
  workflow_dispatch: # Allows you to trigger this manually from the Actions tab

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Combine files
        run: |
          node -e '
          const fs = require("fs");
          
          // Read core file content
          const coreMd = fs.readFileSync("core-file.md", "utf8");
          
          // 1. Create the final Markdown file
          const mdStart = fs.readFileSync("guide-md.md", "utf8");
          fs.writeFileSync("README-MD.md", mdStart + coreMd);
          
          // 2. Create the final Text file
          const txtStart = fs.readFileSync("guide-text.txt", "utf8");
          fs.writeFileSync("README-TXT.txt", txtStart + coreMd);
          
          // 3. Create the final JSON file safely escaping markdown quirks
          const jsonStartRaw = fs.readFileSync("guide-json.json", "utf8");
          
          // Use JSON.stringify to turn the raw markdown into valid JSON escaped characters (\n, \", etc.)
          const escapedCore = JSON.stringify(coreMd);
          // Strip the extra outer quotes automatically added by stringify
          const coreJsonString = escapedCore.substring(1, escapedCore.length - 1);
          
          // Seamlessly stitch the start, the escaped content, add the missing closing quote, and close the JSON object
          const jsonFooter = "\"\n  }\n}";
          fs.writeFileSync("README-JSON.json", jsonStartRaw + coreJsonString + jsonFooter);
          '

      - name: Commit and push generated files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README-MD.md README-TXT.txt README-JSON.json
          git diff-index --quiet HEAD || git commit -m "Automated build: Fixed missing quote in JSON template file"
          git push
