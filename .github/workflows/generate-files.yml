name: Generate Final Templates

on:
  push:
    branches:
      - main
    paths:
      - 'core-file.md'
      - 'guide-md.md'
      - 'guide-text.txt'
      - 'guide-json.json'
  workflow_dispatch: # Allows you to trigger this manually from the Actions tab

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Combine files
        run: |
          node -e '
          const fs = require("fs");
          
          // Read core file content
          const coreMd = fs.readFileSync("core-file.md", "utf8");
          
          // 1. Create the final Markdown file
          const mdStart = fs.readFileSync("guide-md.md", "utf8");
          fs.writeFileSync("README-MD.md", mdStart + coreMd);
          
          // 2. Create the final Text file
          const txtStart = fs.readFileSync("guide-text.txt", "utf8");
          fs.writeFileSync("README-TXT.txt", txtStart + coreMd);
          
          // 3. Create the final JSON file split cleanly into an array of lines
          const jsonStartRaw = fs.readFileSync("guide-json.json", "utf8").trim();
          
          // Strip the incomplete trailing key to turn guide-json.json into a perfectly valid object
          const validBaseJsonString = jsonStartRaw.replace(/,\s*"template"\s*:\s*\{\s*"license_and_content"\s*:\s*"$/, "") + "\n}";
          
          try {
            const jsonObject = JSON.parse(validBaseJsonString);
            
            // Split the markdown content into an array of lines so it structures beautifully in JSON
            jsonObject.template = {
              license_and_content: coreMd.split(/\r?\n/)
            };
            
            // Output nicely formatted, multi-line JSON
            fs.writeFileSync("README-JSON.json", JSON.stringify(jsonObject, null, 2));
            console.log("JSON generated successfully as an array.");
          } catch (err) {
            console.error("Failed to parse the base JSON template:", err.message);
            process.exit(1);
          }
          '

      - name: Commit and push generated files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README-MD.md README-TXT.txt README-JSON.json
          git diff-index --quiet HEAD || git commit -m "Automated build: Readable JSON multi-line array conversion"
          git push
