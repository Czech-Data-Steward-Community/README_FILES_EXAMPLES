name: Generate Final Templates

on:
  push:
    branches:
      - main
    paths:
      - 'core-file.md'
      - 'guide-md.md'
      - 'guide-text.txt'
      - 'guide-json.json'
  workflow_dispatch: # Allows you to trigger this manually from the Actions tab

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Combine files
        run: |
          node -e '
          const fs = require("fs");
          
          // Read core file content
          const coreMd = fs.readFileSync("core-file.md", "utf8");
          
          // 1. Create the final Markdown file
          const mdStart = fs.readFileSync("guide-md.md", "utf8");
          fs.writeFileSync("README-MD.md", mdStart + coreMd);
          
          // 2. Create the final Text file
          const txtStart = fs.readFileSync("guide-text.txt", "utf8");
          fs.writeFileSync("README-TXT.txt", txtStart + coreMd);
          
          // 3. Create the final JSON file using robust JSON parsing
          const jsonStartRaw = fs.readFileSync("guide-json.json", "utf8").trim();
          
          // Clean up the trailing unclosed quote from guide-json.json to make it a valid base object
          let validJsonStart = jsonStartRaw;
          if (validJsonStart.endsWith("\"")) {
             validJsonStart = validJsonStart.substring(0, validJsonStart.lastIndexOf(","));
             validJsonStart += "\n  }\n}";
          }
          
          // Parse base layout framework safely into a JavaScript object
          const jsonObject = JSON.parse(validJsonStart);
          
          // Map core markdown string directly to the designated schema attribute
          if (!jsonObject.template) jsonObject.template = {};
          jsonObject.template.license_and_content = coreMd;
          
          // Safely write the clean, fully-serialized JSON configuration
          fs.writeFileSync("README-JSON.json", JSON.stringify(jsonObject, null, 2));
          '

      - name: Commit and push generated files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README-MD.md README-TXT.txt README-JSON.json
          git commit -m "Automated build: Updated final template files with valid JSON format" || exit 0
          git push
