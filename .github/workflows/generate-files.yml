name: Generate Final Templates

on:
  push:
    branches:
      - main
    paths:
      - 'structure-files/core-file.md'
      - 'structure-files/guide-md.md'
      - 'structure-files/guide-text.txt'
      - 'structure-files/guide-json.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Combine files
        run: |
          node -e '
          const fs = require("fs");
          const coreMd = fs.readFileSync("structure-files/core-file.md", "utf8");
          
          // 1. Create the final Markdown file
          const mdStart = fs.readFileSync("structure-files/guide-md.md", "utf8");
          fs.writeFileSync("templates/README-MD.md", mdStart + coreMd);
          
          // 2. Create the final Text file
          const txtStart = fs.readFileSync("structure-files/guide-text.txt", "utf8");
          fs.writeFileSync("templates/README-TXT.txt", txtStart + coreMd);
          
          // 3. Read valid JSON file directly and parse structurally
          try {
            const jsonObject = JSON.parse(fs.readFileSync("structure-files/guide-json.json", "utf8"));
            const lines = coreMd.split(/\r?\n/);
            const templateSchema = { basic_information: {}, description: {}, metadata: {} };
            let currentSection = "metadata";
            
            lines.forEach(line => {
              const trimmed = line.trim();
              if (!trimmed || trimmed === "---" || trimmed.startsWith("# YOUR TEMPLATE")) return;
              
              if (trimmed.startsWith("## BASIC INFORMATION")) { currentSection = "basic_information"; return; }
              if (trimmed.startsWith("## DESCRIPTION")) { currentSection = "description"; return; }
              
              if (currentSection === "basic_information" && trimmed.includes(":")) {
                const parts = trimmed.split(":");
                const label = parts[0].trim().replace(":", "");
                const rawValue = parts.slice(1).join(":").trim();
                const cleanKey = label.toLowerCase().replace(/\s+/g, "_").replace(/[^a-z0-9_]/g, "");
                const bracketMatch = rawValue.match(/^\[(.*?)\]/);
                templateSchema.basic_information[cleanKey] = {
                  label: label,
                  placeholder: bracketMatch ? bracketMatch[1] : rawValue,
                  value: ""
                };
              }
              
              if (currentSection === "description" && trimmed.startsWith("###")) {
                const subHeader = trimmed.replace("###", "").trim();
                const cleanKey = subHeader.toLowerCase().replace(/\s+/g, "_");
                templateSchema.description[cleanKey] = { label: subHeader, instruction: "", value: "" };
                jsonObject._last_key = cleanKey;
              } else if (currentSection === "description" && trimmed.startsWith(">") && jsonObject._last_key) {
                templateSchema.description[jsonObject._last_key].instruction = trimmed.replace(">", "").trim();
              }
            });
            
            delete jsonObject._last_key;
            jsonObject.template = templateSchema;
            
            fs.writeFileSync("templates/README-JSON.json", JSON.stringify(jsonObject, null, 2));
            console.log("Structured JSON generated successfully.");
          } catch (err) {
            console.error("Failed to compile structured JSON:", err.message);
            process.exit(1);
          }
          '

      - name: Commit and push generated files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add templates/README-MD.md templates/README-TXT.txt templates/README-JSON.json
          git diff-index --quiet HEAD || git commit -m "Automated build: Structured Actionable JSON conversion"
          git push
