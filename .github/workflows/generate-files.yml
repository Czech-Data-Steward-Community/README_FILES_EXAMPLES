name: Generate Final Templates

on:
  issues:
    types: [opened]

jobs:
  build-readme:
    if: contains(github.event.issue.labels.*.name, 'readme-generator') || contains(github.event.issue.title, '[README]')
    runs-on: ubuntu-latest
    
    permissions:
      issues: write
      contents: write
      actions: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Process Text Template and Build Outputs
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          mkdir -p workspace
          
          # 1. GENERATE THE MARKDOWN README
          cat << 'EOF' > workspace/_README.md
          # DATASET NAME: ${ISSUE_TITLE#"[README]: "}

          ${ISSUE_BODY}
          
          ---
          ## ACKNOWLEDGEMENTS
          This README was based on the template/examples authored by the **[Collective of Data Stewards of the Czech Data Stewards Community](https://github.com/Czech-Data-Steward-Community/README_FILES/blob/main/Collective_datastewards.md)** and is licensed under a [Creative Commons Attribution 4.0 International License (CC BY 4.0)](https://creativecommons.org/licenses/by/4.0/).

          ---
          ## README FILE CHANGE HISTORY
          `_README_v1-0` Initial publication generated via automation text workflow.
          EOF

          # Clean up instruction headers from the final file download asset
          sed -i '/### 📜 LICENSE Notice/,/---/d' workspace/_README.md
          sed -i '/👉 **INSTRUCTIONS:/d' workspace/_README.md

          # 2. GENERATE THE STRUCTURAL JSON COMPANION FILE
          node -e '
          const fs = require("fs");
          const rawText = process.env.ISSUE_BODY || "";
          
          const structuredData = {
            dataset_title: process.env.ISSUE_TITLE ? process.env.ISSUE_TITLE.replace("[README]: ", "") : "Untitled Dataset",
            generated_at: new Date().toISOString().split("T")[0],
            basic_information: {},
            description: {},
            unmapped_lines: []
          };
          
          const lines = rawText.split(/\r?\n/);
          let activeSection = "root";
          let lastBlockKey = null;
          
          lines.forEach(line => {
            const trimmed = line.trim();
            if (!trimmed || trimmed === "---" || trimmed.startsWith(">")) return;
            
            if (trimmed.toUpperCase().includes("BASIC INFORMATION")) { activeSection = "basic"; return; }
            if (trimmed.toUpperCase().includes("DESCRIPTION")) { activeSection = "desc"; return; }
            if (trimmed.startsWith("## ") || trimmed.startsWith("# ")) { activeSection = "other"; return; }
            
            if (activeSection === "basic") {
              if (trimmed.includes(":")) {
                const parts = trimmed.split(":");
                const label = parts[0].trim();
                const value = parts.slice(1).join(":").trim();
                const jsonKey = label.toLowerCase().replace(/\s+/g, "_").replace(/[^a-z0-9_]/g, "");
                structuredData.basic_information[jsonKey] = value.startsWith("[") && value.endsWith("]") ? "" : value;
              }
            } else if (activeSection === "desc") {
              if (trimmed.startsWith("### ")) {
                const subheader = trimmed.replace("###", "").trim();
                lastBlockKey = subheader.toLowerCase().replace(/\s+/g, "_").replace(/[^a-z0-9_]/g, "");
                structuredData.description[lastBlockKey] = "";
              } else if (lastBlockKey) {
                structuredData.description[lastBlockKey] += (structuredData.description[lastBlockKey] ? " " : "") + trimmed;
              }
            } else {
              if (!trimmed.startsWith("[") && !trimmed.startsWith("]")) {
                structuredData.unmapped_lines.push(trimmed);
              }
            }
          });
          
          fs.writeFileSync("workspace/readme.json", JSON.stringify(structuredData, null, 2));
          console.log("Structured metadata schema created successfully.");
          '

      - name: Zip and Prepare Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: readme-bundle-issue-${{ github.event.issue.number }}
          path: workspace/
          retention-days: 5

      - name: Respond with Download Link
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ### 🎉 Your Dataset Metadata Files are Ready!
            
            The system has successfully processed your text entry. You can download the formatted bundle containing your markdown text and JSON structural file asset.
            
            👉 **[Download Bundle Assets](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})** *(Navigate to the **Artifacts** panel at the bottom of the page link above to grab your zip).*
            
            *This tracking ticket will now close.*
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up and Close Issue
        run: gh issue close ${{ github.event.issue.number }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
