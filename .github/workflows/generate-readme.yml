name: Generate README From Markdown Issue

on:
  issues:
    types: [opened]

jobs:
  build-readme:
    # Trigger only if the issue has the correct label or title keyword
    if: contains(github.event.issue.labels.*.name, 'readme-generator') || contains(github.event.issue.title, '[README]')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Process Text Template and Build Outputs
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          mkdir -p output-${{ github.event.issue.number }}
          
          # 1. GENERATE THE MARKDOWN README
          # We dump the raw body text provided by the user directly into the _README.md asset
          # while stripping off the instruction blocks they left behind.
          cat << 'EOF' > output-${{ github.event.issue.number }}/_README.md
          # DATASET NAME: ${ISSUE_TITLE#"[README]: "}

          $ISSUE_BODY
          
          ---
          ## ACKNOWLEDGEMENTS
          This README was based on the template/examples authored by the **[Collective of Data Stewards of the Czech Data Stewards Community](https://github.com/Czech-Data-Steward-Community/README_FILES/blob/main/Collective_datastewards.md)** and is licensed under a [Creative Commons Attribution 4.0 International License (CC BY 4.0)](https://creativecommons.org/licenses/by/4.0/).

          ---
          ## README FILE CHANGE HISTORY
          `_README_v1-0` Initial publication generated via automation text workflow.
          EOF

          # Clean up instructions from the user's generated file if they didn't delete them
          sed -i '/### 📜 LICENSE Notice/,/---/d' output-${{ github.event.issue.number }}/_README.md
          sed -i '/👉 **INSTRUCTIONS:/d' output-${{ github.event.issue.number }}/_README.md

          # 2. GENERATE THE JSON COMPANION FILE
          # Since it is a text block, we convert the raw lines into a single safe JSON string asset
          node -e '
          const fs = require("fs");
          const rawText = process.env.ISSUE_BODY || "";
          
          const data = {
            dataset_title: process.env.ISSUE_TITLE,
            generated_at: new Date().toISOString().split("T")[0],
            raw_metadata_content: rawText.split("\n").map(line => line.trim()).filter(line => line.length > 0)
          };
          
          fs.writeFileSync(`output-${process.env.GITHUB_ISSUE_NUMBER}/readme.json`, JSON.stringify(data, null, 2));
          '
        env:
          GITHUB_ISSUE_NUMBER: ${{ github.event.issue.number }}

      - name: Zip and Prepare Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: readme-files-issue-${{ github.event.issue.number }}
          path: output-${{ github.event.issue.number }}/

      - name: Respond with Download Link
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ### 🎉 Your Dataset Metadata Files are Ready!
            
            The system has successfully processed your text entry. You can download the formatted bundle containing your markdown text and JSON structural file asset.
            
            👉 **[Download Bundle Assets](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})** *(Scroll down to the **Artifacts** panel at the bottom of the landing page to download your zip).*
            
            *This tracking ticket will now close.*
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up and Close Issue
        run: gh issue close ${{ github.event.issue.number }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
