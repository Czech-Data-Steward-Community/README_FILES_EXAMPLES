name: Generate a Complete Dataset README
description: Fill out this form to generate a structured README.md and JSON file.
title: "[README]: "
labels: [readme-generator]
body:
  - type: markdown
    attributes:
      value: "### Czech Data Stewards Community README Generator\nFill in only the sections relevant to your dataset; you can leave optional sections completely blank."
  - type: input
    id: dataset_name
    attributes:
      label: "DATASET NAME"
      placeholder: "e.g., Archaeological Excavation Data"
    validations:
      required: true
  - type: textarea
    id: authors
    attributes:
      label: "Authors"
      description: "Provide one per line: First name, last name, ORCID"
    validations:
      required: true
  - type: input
    id: main_contact
    attributes:
      label: "Main Contact Email"
      placeholder: "email@example.cz"
    validations:
      required: true
  - type: input
    id: dataset_license
    attributes:
      label: "Dataset License"
      value: "CC-BY 4.0"
    validations:
      required: true
  - type: input
    id: readme_version
    attributes:
      label: "README Version"
      value: "_README_v1-0"
    validations:
      required: true
  - type: input
    id: pid
    attributes:
      label: "Persistent Identifier (PID / DOI)"
  - type: input
    id: project_website
    attributes:
      label: "Project Website"
  - type: textarea
    id: brief_description
    attributes:
      label: "Brief Description"
  - type: textarea
    id: research_context
    attributes:
      label: "Research Context"
  - type: textarea
    id: related_publications
    attributes:
      label: "Related Publications"
  - type: textarea
    id: directory_structure
    attributes:
      label: "Directory Structure"
  - type: textarea
    id: file_descriptions
    attributes:
      label: "File Descriptions"
  - type: textarea
    id: encoding
    attributes:
      label: "Encoding & Formatting"
  - type: textarea
    id: variable_descriptions
    attributes:
      label: "Variable Descriptions"
  - type: textarea
    id: special_values
    attributes:
      label: "Special Values"
  - type: input
    id: collection_date
    attributes:
      label: "Collection Date Range"
  - type: input
    id: collection_location
    attributes:
      label: "Collection Location"
  - type: textarea
    id: tools_for_collection
    attributes:
      label: "Tools for Collection"
  - type: textarea
    id: original_data
    attributes:
      label: "Original Data Details"
  - type: textarea
    id: method_of_collection
    attributes:
      label: "Method of Collection/Production"
  - type: textarea
    id: processing_workflow
    attributes:
      label: "Data Processing Steps"
  - type: textarea
    id: processing_software
    attributes:
      label: "Software Used"
  - type: textarea
    id: data_completeness
    attributes:
      label: "Data Completeness & Quality"
  - type: textarea
    id: license_terms
    attributes:
      label: "License and Terms of Use"
  - type: textarea
    id: restrictions_recommendations
    attributes:
      label: "Restrictions and Recommendations"
  - type: textarea
    id: hardware_software_requirements
    attributes:
      label: "Software and Hardware Requirements"
  - type: textarea
    id: proposed_citation
    attributes:
      label: "Proposed Citation"
  - type: textarea
    id: ethics_personal_data
    attributes:
      label: "Personal and Sensitive Data Protection"
  - type: input
    id: ethical_approval
    attributes:
      label: "Ethical Approval Reference"
  - type: textarea
    id: informed_consent
    attributes:
      label: "Informed Consent Details"
